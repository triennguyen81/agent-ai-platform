# Promtail — discovers running compose containers via the Docker socket and
# ships their stdout/stderr to Loki. Labels services so logs can be filtered
# in Grafana by `service` or `compose_project`.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Compose puts the service name in com.docker.compose.service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
        replacement: "$1"
      # Drop Promtail's own logs from the stream (it spams about discovery)
      - source_labels: ["service"]
        regex: "promtail"
        action: drop
    pipeline_stages:
      # Try to parse the JSON we already emit from the gateway. Falls through
      # silently for non-JSON lines (agent uses plain text by default).
      - json:
          expressions:
            level: LogLevel
            category: Category
            message: Message
      - labels:
          level:
          category:
