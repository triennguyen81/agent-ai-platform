name: Build & Deploy

# master → CI (ci.yml) green → build gateway/agent/web images → deploy to the
# production server over SSH. Manual run: leave image_tag empty to build and
# deploy the branch head; set image_tag (e.g. sha-abc1234) to redeploy an
# image that already exists in GHCR without rebuilding — that is the rollback.
# Setup (secrets, variables, server): docs/operations/deploy.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (e.g. sha-abc1234). Empty = build the selected branch and deploy it."
        required: false
        default: ""
      deploy:
        description: "Deploy after building"
        type: boolean
        default: true

concurrency:
  group: build-deploy-production
  cancel-in-progress: false   # never interrupt a deploy half-way

permissions:
  contents: read
  packages: write   # ghcr.io push

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve commit and tag
    runs-on: ubuntu-latest
    # Automatic runs only follow a green CI run of a push to master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
      prefix: ${{ steps.resolve.outputs.prefix }}
    steps:
      - id: resolve
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          if [ -n "$INPUT_TAG" ]; then
            # The tag ends up in a command run on the server: allow image-tag characters only.
            if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid image_tag '$INPUT_TAG'"; exit 1
            fi
            tag="$INPUT_TAG"; build=false
          else
            tag="sha-${sha::7}"; build=true
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "build=$build"
            echo "prefix=${REGISTRY}/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "### ${tag} (${sha::7}) — build: ${build}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build · ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: aiq-gateway
            context: ./gateway
            dockerfile: ./gateway/src/Aiq.Gateway/Dockerfile
          - service: aiq-agent
            context: ./agent
            dockerfile: ./agent/Dockerfile
          - service: aiq-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.prefix }}/${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.prefix }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          # Only the web image uses it (baked into the Next.js client bundle); empty = Clerk off.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy · production
    needs: [prepare, build]
    # Runs after a successful build, or directly (build skipped) for a rollback to an existing tag.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/aiq' }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME || 'aiq-agentic' }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREFIX: ${{ needs.prepare.outputs.prefix }}
    steps:
      - name: Check deploy configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_USER secrets are not set — images were built, deploy skipped. See docs/operations/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          sparse-checkout: |
            docker-compose.yml
            docker-compose.prod.yml
            scripts/deploy
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS is required (ssh-keyscan -p <port> <host> output) — host keys are not trusted blindly."
            exit 1
          fi
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${DEPLOY_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload compose files and deploy script
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2029  # values are expanded by the runner on purpose
          ssh prod "mkdir -p '${DEPLOY_PATH}/scripts/deploy'"
          scp docker-compose.yml docker-compose.prod.yml "prod:${DEPLOY_PATH}/"
          scp scripts/deploy/remote-deploy.sh "prod:${DEPLOY_PATH}/scripts/deploy/"

      - name: Log the server in to GHCR
        if: steps.cfg.outputs.ready == 'true'
        # Short-lived job token (packages: read), sent over stdin — never on a command line.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # values are expanded by the runner on purpose
          printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ${REGISTRY} -u '${GHCR_USER}' --password-stdin"

      - name: Deploy ${{ needs.prepare.outputs.tag }}
        if: steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2029  # values are expanded by the runner on purpose
          ssh prod "cd '${DEPLOY_PATH}' && \
            AIQ_IMAGE_TAG='${TAG}' AIQ_IMAGE_PREFIX='${PREFIX}' COMPOSE_PROJECT_NAME='${COMPOSE_PROJECT_NAME}' \
            bash scripts/deploy/remote-deploy.sh"
          echo "Deployed **${TAG}** to production." >> "$GITHUB_STEP_SUMMARY"

      - name: Log the server out of GHCR
        if: always() && steps.cfg.outputs.ready == 'true'
        run: |
          # shellcheck disable=SC2029  # values are expanded by the runner on purpose
          ssh prod "docker logout ${REGISTRY}" || true
