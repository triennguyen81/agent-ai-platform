name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-build:
    name: Gateway · build
    runs-on: ubuntu-latest
    # ACL V2 final phase (V2-H): a real Postgres service so the ~189
    # DB-backed integration tests (department/tenant isolation, capability
    # resolution, ACL V2 ownership, legacy-agent migration, etc.) actually
    # run in CI instead of silently no-oping — see D8_PRODUCTION_READINESS_AUDIT.md
    # §2. serial.runsettings + xunit.runner.json run the suite serially, but
    # the per-class test databases still peak at ~414 concurrent connections
    # (measured), so the "Raise PostgreSQL connection limit" step lifts the
    # default max_connections=100 that otherwise fails fixtures with 53300.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: aiq_gw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror
      - name: Raise PostgreSQL connection limit
        # Service containers cannot take server flags, so set it and restart.
        # TCP readiness (-h 127.0.0.1) skips the image's socket-only init server.
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          ready() {
            for _ in $(seq 1 60); do
              docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -q && return 0
              sleep 1
            done
            echo "::error::PostgreSQL service did not become ready"; return 1
          }
          ready
          docker exec "$PG_CONTAINER" psql -h 127.0.0.1 -U postgres -c "ALTER SYSTEM SET max_connections = 1000"
          docker restart "$PG_CONTAINER"
          ready
          test "$(docker exec "$PG_CONTAINER" psql -h 127.0.0.1 -U postgres -Atc 'SHOW max_connections')" = 1000
      - name: Test
        env:
          AIQ_TEST_POSTGRES: "Host=localhost;Port=5432;Database=aiq_gw_test;Username=postgres;Password=testpass"
        run: |
          mapfile -t projects < <(find tests -name '*.Tests.csproj' | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error::No Gateway test project found under gateway/tests — refusing to skip tests."
            exit 1
          fi
          for project in "${projects[@]}"; do
            dotnet test "$project" --configuration Release --no-build --logger "trx" --settings tests/Aiq.Gateway.Tests/serial.runsettings
          done

  agent-lint:
    name: Agent · lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev extras
        run: pip install '.[dev]'
      - name: Ruff check
        run: ruff check src tests

  agent-test:
    name: Agent · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev extras
        run: pip install '.[dev]'
      - name: Pytest
        run: pytest -q

  web-build:
    name: Web · typecheck, test, build
    runs-on: ubuntu-latest
    # ACL V2 final phase (V2-H): Web previously had no CI job at all — a
    # broken build or a failing Vitest suite (the nav-model role/route
    # matrix, now 15 tests) would not be caught before merge — see
    # D8_PRODUCTION_READINESS_AUDIT.md §2.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Production build
        run: npx next build

  compose-validate:
    name: Compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        env:
          POSTGRES_USER: aiq
          POSTGRES_PASSWORD: aiq-test-password
          POSTGRES_DB: aiq
          QDRANT_API_KEY: test
          REDIS_PASSWORD: aiq-test-redis
          JWT_SIGNING_KEY: test_test_test_test_test_test_test_test_32
        run: docker compose config -q
