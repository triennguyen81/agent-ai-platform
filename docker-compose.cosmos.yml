# Cosmos VPS overlay — composed on top of docker-compose.yml.
#
# Usage on the VPS:
#   cd /opt/apps/aiq
#   docker compose -f docker-compose.yml -f docker-compose.cosmos.yml up -d --build
#
# Strategy:
#   - Caddy stays disabled (profile `edge`) — agentic-npm already owns 80/443.
#   - Gateway + Agent join the existing external `agentic-net` network so
#     NPM can reach them by container name (aiq-gateway, aiq-agent) and we
#     keep ZERO host port exposure for them.
#   - Internal services (postgres, redis, qdrant, prometheus, loki, grafana)
#     drop ALL host port bindings. The AIQ stack reaches them by container
#     name inside the private aiq-net. Admin access uses `docker compose
#     exec`. This avoids the Docker daemon's confused port allocator on
#     this host AND closes attack surface.

services:
  # Override base compose's host port lists with empty lists (compose v2.20+
  # merge semantics replace lists). The container ports stay open inside
  # the docker network for service-to-service traffic.
  postgres:
    ports: []
  qdrant:
    ports: []
  redis:
    ports: []
  prometheus:
    ports: []
  loki:
    ports: []
  grafana:
    ports: []

  # MinIO: even hide the console port on cosmos (base compose binds it
  # to 127.0.0.1 for local dev; on cosmos we rely on SSH port-forwarding
  # instead so nothing is on the host directly). Compose merges the
  # ports LIST unfortunately, so this line is not sufficient by itself —
  # the base compose file has been tightened to only expose 9001.
  minio: {}

  gateway:
    ports: []
    environment:
      # Use the container_name `aiq-postgres` instead of the compose service
      # alias `postgres`. Gateway joins BOTH aiq-net and agentic-net so it
      # can be reached by NPM, but that puts the agentic stack's `postgres`
      # alias in the same DNS namespace — Docker resolved `postgres` to the
      # AGENTIC postgres (172.19.0.x) and the wrong password rejected us.
      ConnectionStrings__Postgres: "Host=aiq-postgres;Port=5432;Database=${POSTGRES_DB:-aiq};Username=${POSTGRES_USER:-aiq};Password=${POSTGRES_PASSWORD:-aiq};Pooling=true"
      # Also override the agent base URL for the same reason — `agent` could
      # collide with anything else on agentic-net in the future.
      Agent__BaseUrl: "http://aiq-agent:8000"
    networks:
      - aiq-net
      - agentic-net

  agent:
    ports: []
    environment:
      # Cross-network DNS — point at container_name (same reason as gateway).
      GATEWAY_BASE_URL: "http://aiq-gateway:8080"
      QDRANT_URL: "http://aiq-qdrant:6333"
      # Chat memory: Postgres so history persists indefinitely (no 24h Redis TTL).
      # Same container-name reason as gateway — use aiq-postgres to disambiguate
      # from a potential `postgres` alias on the shared agentic-net.
      MEMORY_BACKEND: "postgres"
      MEMORY_POSTGRES_DSN: "postgresql://${POSTGRES_USER:-aiq}:${POSTGRES_PASSWORD:-aiq}@aiq-postgres:5432/${POSTGRES_DB:-aiq}"
      # Route /chat + /agent/run through the local `claude` CLI subprocess
      # so requests bill against a Claude Max/Pro subscription instead of a
      # pay-per-token API key. Requires `docker exec -it aiq-agent claude login`
      # once after the volume is mounted (OAuth token persists in the volume).
      LLM_PROVIDER: ${LLM_PROVIDER:-claude_cli}
      # Explicitly unset so the CLI falls through to OAuth (subscription)
      # instead of silently reusing an API key that may have $0 balance.
      # Comment this line and set ANTHROPIC_API_KEY in .env to switch back.
      ANTHROPIC_API_KEY: ""
    volumes:
      # Persist the OAuth token created by `claude login` across container
      # recreates. Without this, every `docker compose up -d agent` would
      # log the user out and break every LLM call.
      - agent_claude_home:/home/app/.claude
    networks:
      - aiq-net
      - agentic-net

  web:
    ports: []
    environment:
      # Container-name hostnames — same reason as gateway above (cross-net
      # DNS collision risk on the shared agentic-net).
      GATEWAY_BASE_URL: "http://aiq-gateway:8080"
      AGENT_BASE_URL: "http://aiq-agent:8000"
      # Sensitive — set in /opt/apps/aiq/.env on the VPS
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    networks:
      - aiq-net
      - agentic-net
    # Container hardening added after 2026-07-26 crypto-miner incident:
    # malware wrote binaries to writable filesystem paths and spawned
    # background processes. read_only + tmpfs(noexec) blocks the write path;
    # cap_drop + no-new-privileges narrows what a compromised process can do.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    profiles: ["edge"]

networks:
  agentic-net:
    external: true
    name: agentic-net

volumes:
  # OAuth token store for the `claude` CLI running inside aiq-agent.
  # Once `claude login` has been run inside the container, the token in
  # here powers every /chat + /agent/run call — no API key needed.
  agent_claude_home:
