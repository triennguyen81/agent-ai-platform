[project]
name = "aiq-agent"
version = "0.1.0"
description = "AIQ Agentic AI runtime (Planner-Executor-Critic over Qwen3/Claude)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "redis>=5.2",
  "python-multipart>=0.0.18",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b2",
  "opentelemetry-instrumentation-httpx>=0.49b2",
  "opentelemetry-instrumentation-redis>=0.49b2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28",
  # 8.0.0 crashes on FastAPI 0.115+ (route.path AttributeError on
  # _IncludedRouter). Pin to 7.x until upstream ships a fix.
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
  # Phase 2: Claude Agent SDK for /agent/run multi-step task endpoint.
  # Spawns the `claude` CLI as subprocess — Dockerfile installs it.
  "claude-agent-sdk>=0.1.0",
  # Accounting Mức 2: import_excel_ledger tool reads XLSX files.
  # CSV / TSV use stdlib csv module — no extra dep needed.
  "openpyxl>=3.1",
  # M6: Qdrant top-K embeddings (RAG scaling).
  # fastembed runs sentence-transformer models locally via ONNX —
  # no API cost, ~120 MB model auto-downloaded on first init.
  "qdrant-client>=1.12",
  "fastembed>=0.4",
  # Postgres async driver — required by PostgresMemoryStore (chat history
  # persistence) and by the OCR validator's pgvector integration.
  "asyncpg>=0.30",
  # Contract Upload DOCX extraction (api/document_routes.py). Pure-Python,
  # no native/ML deps — kept in base deps (not the [ocr] extra) so it's
  # always available, unlike the heavy PaddleOCR/pypdfium2 stack.
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff==0.17.2",
]
# OCR pipeline — heavy ML deps. Install explicitly: pip install '.[ocr]'.
ocr = [
  "pypdfium2>=4.30",
  "Pillow>=10.4",
  "paddleocr>=2.8",
  "paddlepaddle>=2.6",
]
# pgvector validation — small enough to ship in base would be fine, kept
# separate so unit tests don't require a live Postgres.
pgvector = [
  "asyncpg>=0.30",
  "pgvector>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiq_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers are evaluated once by design; B008 still applies to every other call.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
