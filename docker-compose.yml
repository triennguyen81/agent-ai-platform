name: aiq-agentic

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiq}
      POSTGRES_DB: ${POSTGRES_DB:-aiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiq} -d ${POSTGRES_DB:-aiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiq-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  redis:
    image: redis:7-alpine
    container_name: aiq-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-aiq}"
      - "--appendonly"
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiq}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  gateway:
    build:
      context: ./gateway
      dockerfile: src/Aiq.Gateway/Dockerfile
    container_name: aiq-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aiq};Username=${POSTGRES_USER:-aiq};Password=${POSTGRES_PASSWORD:-aiq};Pooling=true"
      Jwt__Issuer: ${JWT_ISSUER:-aiq.local}
      Jwt__Audience: ${JWT_AUDIENCE:-aiq.client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenMinutes: 60
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - aiq-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: aiq-agent
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
    ports:
      - "${AGENT_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aiq-net

  caddy:
    image: caddy:2-alpine
    container_name: aiq-caddy
    restart: unless-stopped
    depends_on:
      - gateway
      - agent
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aiq-net

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  aiq-net:
    driver: bridge
