name: aiq-agentic

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiq}
      POSTGRES_DB: ${POSTGRES_DB:-aiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiq} -d ${POSTGRES_DB:-aiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiq-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  redis:
    image: redis:7-alpine
    container_name: aiq-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-aiq}"
      - "--appendonly"
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiq}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

networks:
  aiq-net:
    driver: bridge
