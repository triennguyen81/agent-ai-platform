name: aiq-agentic

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiq}
      POSTGRES_DB: ${POSTGRES_DB:-aiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiq} -d ${POSTGRES_DB:-aiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiq-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  redis:
    image: redis:7-alpine
    container_name: aiq-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-aiq}"
      - "--appendonly"
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aiq}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aiq-net

  gateway:
    build:
      context: ./gateway
      dockerfile: src/Aiq.Gateway/Dockerfile
    container_name: aiq-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aiq};Username=${POSTGRES_USER:-aiq};Password=${POSTGRES_PASSWORD:-aiq};Pooling=true;Minimum Pool Size=4;Maximum Pool Size=100;Timeout=15;Command Timeout=30;Keepalive=30;Tcp Keepalive=true"
      Jwt__Issuer: ${JWT_ISSUER:-aiq.local}
      Jwt__Audience: ${JWT_AUDIENCE:-aiq.client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenMinutes: 60
      Agent__BaseUrl: ${AGENT_INTERNAL_BASE_URL:-http://agent:8000}
      Agent__TimeoutSeconds: ${AGENT_TIMEOUT_SECONDS:-300}
      ExternalAuth__SharedSecret: ${EXTERNAL_AUTH_SHARED_SECRET:-}
      Jobs__UploadStagingDirectory: /var/aiq/uploads
      Jobs__WorkerCount: ${HANGFIRE_WORKERS:-4}
      Observability__ServiceName: aiq-gateway
      Observability__Environment: ${DEPLOY_ENV:-production}
      Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - gateway_uploads:/var/aiq/uploads
    networks:
      - aiq-net

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: aiq-agent
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-2048}
      MEMORY_BACKEND: ${MEMORY_BACKEND:-redis}
      MEMORY_TTL_SECONDS: ${MEMORY_TTL_SECONDS:-86400}
      MEMORY_MAX_MESSAGES: ${MEMORY_MAX_MESSAGES:-200}
      REDIS_URL: ${REDIS_INTERNAL_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-aiq}
      MEMORY_POSTGRES_DSN: ${MEMORY_POSTGRES_DSN:-}
      GATEWAY_BASE_URL: ${AGENT_GATEWAY_BASE_URL:-http://gateway:8080}
      # M6 — Qdrant top-K embeddings (self-hosted via fastembed)
      QDRANT_URL: ${QDRANT_INTERNAL_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-aiq_notes}
      OTEL_SERVICE_NAME: aiq-agent
      OTEL_DEPLOYMENT_ENVIRONMENT: ${DEPLOY_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${AGENT_PORT:-8001}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aiq-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: aiq-web
    restart: unless-stopped
    depends_on:
      - gateway
      - agent
    environment:
      GATEWAY_BASE_URL: ${WEB_GATEWAY_BASE_URL:-http://gateway:8080}
      AGENT_BASE_URL: ${WEB_AGENT_BASE_URL:-http://agent:8000}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    ports:
      - "${WEB_PORT:-3030}:3000"
    networks:
      - aiq-net

  caddy:
    image: caddy:2-alpine
    container_name: aiq-caddy
    restart: unless-stopped
    depends_on:
      - gateway
      - agent
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aiq-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: aiq-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - aiq-net

  loki:
    image: grafana/loki:3.3.2
    container_name: aiq-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - aiq-net

  promtail:
    image: grafana/promtail:3.3.2
    container_name: aiq-promtail
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only access to the host Docker socket so Promtail can discover and
      # tail every container's stdout/stderr via the Docker logs API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aiq-net

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage for voucher/contract uploads.
  # Files are addressable by URL (signed, expiring), replicable, and can
  # migrate to AWS S3 or Cloudflare R2 without app changes (same SDK).
  # See docs/arch/s3-migration-plan.md for the migration rollout.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aiq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_min_32_chars_before_prod}
    volumes:
      - minio_data:/data
    # API port 9000 stays internal (aiq-net only) — no host binding.
    # Local dev users who need the API on the host can add
    # `MINIO_API_PORT=9000` in a per-user compose override.
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - aiq-net

  # One-shot bucket bootstrap: creates required buckets on first boot and exits.
  # Runs on `docker compose up`, then stays exited — no ongoing overhead.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: aiq-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aiq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_min_32_chars_before_prod}
    entrypoint: >
      /bin/sh -c "
      mc alias set aiq http://aiq-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing aiq/voucher-uploads;
      mc mb --ignore-existing aiq/contract-uploads;
      mc anonymous set none aiq/voucher-uploads;
      mc anonymous set none aiq/contract-uploads;
      echo 'Buckets ready';
      "
    networks:
      - aiq-net
    restart: "no"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aiq-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aiq}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - aiq-net

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  caddy_data:
  caddy_config:
  gateway_uploads:
  prometheus_data:
  loki_data:
  grafana_data:
  minio_data:

networks:
  aiq-net:
    driver: bridge
